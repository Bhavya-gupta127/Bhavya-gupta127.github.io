<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PartyNights.online — Instant Party Games for Friends</title>
  <meta name="description" content="Play Mr. Alien and instant browser party games with friends at PartyNights.online. Zero downloads — pass one phone and start playing." />
  <link rel="canonical" href="https://partynights.online/" />
  <link rel="icon" type="image/png" sizes="192x192" href="/mr-alien/icon-192.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PartyNights.online — Instant Party Games" />
  <meta property="og:description" content="Play Mr. Alien (500+ Desi Words) & party night games directly in your browser." />
  <meta property="og:image" content="https://partynights.online/mr-alien/og-banner.png" />
  <style>
    :root {
      --bg: #070812;
      --card: #121426;
      --card-hover: #191c35;
      --accent: #ff2e63;
      --accent-2: #7c3aed;
      --cyan: #10d796;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d153b 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.35rem 1.25rem;
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ff2e63, #a855f7, #10d796);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .room-pill {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 0.38rem 0.85rem;
      border-radius: 999px;
      color: var(--muted);
    }
    main {
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      flex: 1;
    }
    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .hero h1 {
      font-size: clamp(2rem, 4.8vw, 3.1rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 560px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.35rem;
      max-width: 740px;
      margin: 0 auto;
    }
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.6rem;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .game-card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: rgba(16, 215, 150, 0.45);
      box-shadow: 0 16px 40px rgba(16, 215, 150, 0.12);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .game-icon-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .game-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .emoji {
      font-size: 2.3rem;
    }
    .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(16, 215, 150, 0.14);
      color: var(--cyan);
      border: 1px solid rgba(16, 215, 150, 0.3);
    }
    .game-card h2 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      font-weight: 800;
    }
    .game-card p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.4rem;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    .play-btn {
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .ad-slot {
      margin: 3rem auto 0;
      max-width: 728px;
      min-height: 90px;
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.28);
      font-size: 0.8rem;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">🎉 PartyNights.online</a>
    <div class="room-pill">House Party Games</div>
  </header>

  <main>
    <section class="hero">
      <h1>Party Night Games</h1>
      <p>Pick a game below, pass the phone, and start playing immediately.</p>
    </section>

    <div class="grid" id="games-grid"></div>

    <!-- Google AdSense / Sponsor Container Ready -->
    <div class="ad-slot" id="ad-container">
      <span>Ad / Sponsor Banner Slot (Ready for AdSense on partynights.online)</span>
    </div>
  </main>

  <footer>
    <strong>PartyNights.online</strong> • <a href="/privacy" style="color:var(--muted);">Privacy & Terms</a>
  </footer>

  <script src="/games.js"></script>
  <script>
    const grid = document.getElementById('games-grid');
    const gamesList = [...(window.PARTY_GAMES || [])];

    function renderGames() {
      grid.innerHTML = gamesList.map(g => `
        <a class="game-card" href="${g.url}">
          <div>
            <div class="card-top">
              <div class="game-icon-wrap">
                ${g.icon ? `<img class="game-icon" src="${g.icon}" alt="${g.title}" />` : `<span class="emoji">${g.emoji || '🎮'}</span>`}
              </div>
              <span class="badge">${g.badge || 'Party Game'}</span>
            </div>
            <h2>${g.title}</h2>
            <p>${g.description || 'Tap to launch and play with friends.'}</p>
          </div>
          <div class="meta">
            <span>👥 ${g.players || 'Multiplayer'}</span>
            <span class="play-btn">Play Now →</span>
          </div>
        </a>
      `).join('');
    }

    // Automatically discover any new GitHub repos tagged with topic 'party-game' or 'partynights'
    async function discoverGitHubGameRepos() {
      if (!window.GITHUB_OWNER) return;
      try {
        const res = await fetch(`https://api.github.com/users/${window.GITHUB_OWNER}/repos?sort=updated&per_page=100`);
        if (!res.ok) return;
        const repos = await res.json();
        const knownIds = new Set(gamesList.map(g => g.id.toLowerCase()));
        let added = false;

        for (const r of repos) {
          const topics = Array.isArray(r.topics) ? r.topics.map(t => t.toLowerCase()) : [];
          const isPartyGame = topics.includes('party-game') || topics.includes('partynights');
          if (!isPartyGame) continue;
          if (knownIds.has(r.name.toLowerCase())) continue;

          gamesList.push({
            id: r.name,
            repo: r.full_name,
            title: r.name.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
            emoji: '🎮',
            players: 'Party Game',
            badge: 'New Game',
            description: r.description || 'Launch game and play with friends.',
            url: r.homepage && r.homepage.startsWith('http') ? r.homepage : `/${r.name}/`
          });
          knownIds.add(r.name.toLowerCase());
          added = true;
        }
        if (added) renderGames();
      } catch (_) {}
    }

    renderGames();
    discoverGitHubGameRepos();
  </script>
</body>
</html>
