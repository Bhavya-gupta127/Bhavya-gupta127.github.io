<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Custom Game Template — PartyNights.online</title>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #070812;
      color: #f8fafc;
      padding: max(1rem, calc(env(safe-area-inset-top, 0px) + 0.5rem)) 1.25rem calc(2rem + env(safe-area-inset-bottom, 0px));
      text-align: center;
      margin: 0;
    }
    header.top-bar {
      max-width: 540px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      background: rgba(18, 20, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
    }
    .ios-back-btn {
      height: 36px;
      padding: 0 12px 0 7px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      font-size: 0.78rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .ios-back-btn svg {
      width: 16px;
      height: 16px;
      stroke: #10d796;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 6, 15, 0.82);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .modal-backdrop.open { display: flex; }
    .leave-warning-sheet {
      max-width: 380px;
      width: 100%;
      background: linear-gradient(180deg, #161a36 0%, #0d1022 100%);
      border: 1px solid rgba(255, 46, 99, 0.42);
      border-radius: 24px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .btn-stay {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #10d796, #34d399);
      color: #04130e;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .btn-leave {
      width: 100%;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255, 46, 99, 0.45);
      background: rgba(255, 46, 99, 0.14);
      color: #fda4af;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <button type="button" class="ios-back-btn" id="btn-ios-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Arcade</span>
    </button>
    <strong style="font-size: 0.9rem;">PartyNights.online</strong>
  </header>

  <h1 style="margin-top: 1.5rem;">Your Custom Standalone Game</h1>
  <p style="color:#94a3b8; margin-top: 0.5rem;">
    Drop any standalone HTML/JS game file inside <code>/games/</code> and add <code>url: "/games/your-file.html"</code> to <code>games.js</code>!
  </p>

  <!-- Standard Leave Game Warning Modal -->
  <div class="modal-backdrop" id="modal-leave-warning" role="dialog" aria-modal="true">
    <div class="leave-warning-sheet">
      <div style="font-size: 2rem;">⚠️</div>
      <h3 style="margin: 0;">Leave Active Game?</h3>
      <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Leaving now will end your current round.</p>
      <button type="button" class="btn-stay" id="btn-leave-stay">🛡️ Stay &amp; Keep Playing</button>
      <button type="button" class="btn-leave" id="btn-leave-confirm">🚪 Leave Game</button>
    </div>
  </div>

  <script>
    const leaveModal = document.getElementById('modal-leave-warning');
    document.getElementById('btn-ios-back').addEventListener('click', () => {
      leaveModal.classList.add('open');
    });
    document.getElementById('btn-leave-stay').addEventListener('click', () => {
      leaveModal.classList.remove('open');
    });
    document.getElementById('btn-leave-confirm').addEventListener('click', () => {
      window.location.href = 'https://partynights.online/';
    });
  </script>
</body>
</html>
